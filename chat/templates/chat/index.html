{% load static %}<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gaandal</title>
  <meta name="csrf-token" content="{{ csrf_token }}">
  <link rel="stylesheet" href="{% static 'chat/css/style.css' %}?v=flags2">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["\\(", "\\)"], ["$", "$"]],
        displayMath: [["\\[", "\\]"], ["$$", "$$"]],
        processEscapes: true
      },
      options: { skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"] }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="logo">✦</span>
        <span class="brand-name">Gaandal</span>
        <div id="activeFlag" aria-live="polite"></div>
      </div>
      <button class="btn-new" id="newChat">＋ Nouvelle conversation</button>
      <div class="side-label">Récentes</div>
      <nav class="conv-list" id="convList"></nav>
      <div class="side-footer">
        <button class="btn-ghost" id="themeToggle" title="Changer de thème">◐ Thème</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="btn-ghost menu" id="menuBtn" aria-label="Menu">☰</button>
        <div class="topbar-title" id="chatTitle">Gaandal</div>
      </header>

      <section class="messages" id="messages" aria-live="polite" data-flag-base="{% static 'chat/flags/' %}">
        <div class="welcome" id="welcome">
          <div class="welcome-logo">✦</div>
          <h1>Jam tan! Miɗo Gaandal.</h1>
          <p>Avant de commencer, quelle variante dialectale souhaitez-vous utiliser ?</p>
          <div class="dialect-selection">
            <button class="dialect-btn" type="button" data-dialect="pular_gn" aria-label="Pular (Guinée / Fouta-Djalon)" aria-pressed="false">
              <span class="flag-list" aria-hidden="true"><img class="country-flag-img" width="18" height="12" src="{% static 'chat/flags/gn.svg' %}" alt="" title="Guinée"></span>
              <span>Pular (Guinée / Fouta-Djalon)</span>
            </button>
            <button class="dialect-btn" type="button" data-dialect="pulaar_sn" aria-label="Pulaar (Sénégal, Mauritanie, Gambie)" aria-pressed="false">
              <span class="flag-list" aria-hidden="true"><img class="country-flag-img" width="18" height="12" src="{% static 'chat/flags/sn.svg' %}" alt="" title="Sénégal"><img class="country-flag-img" width="18" height="12" src="{% static 'chat/flags/mr.svg' %}" alt="" title="Mauritanie"><img class="country-flag-img" width="18" height="12" src="{% static 'chat/flags/gm.svg' %}" alt="" title="Gambie"></span>
              <span>Pulaar (Sénégal, Mauritanie, Gambie)</span>
            </button>
            <button class="dialect-btn" type="button" data-dialect="fulfulde_ml" aria-label="Maasina (Mali)" aria-pressed="false">
              <span class="flag-list" aria-hidden="true"><img class="country-flag-img" width="18" height="12" src="{% static 'chat/flags/ml.svg' %}" alt="" title="Mali"></span>
              <span>Maasina (Mali)</span>
            </button>
            <button class="dialect-btn" type="button" data-dialect="fulfulde_east" aria-label="Fulfulde de l’Est (Nigeria, Cameroun, Tchad)" aria-pressed="false">
              <span class="flag-list" aria-hidden="true"><img class="country-flag-img" width="18" height="12" src="{% static 'chat/flags/ng.svg' %}" alt="" title="Nigeria"><img class="country-flag-img" width="18" height="12" src="{% static 'chat/flags/cm.svg' %}" alt="" title="Cameroun"><img class="country-flag-img" width="18" height="12" src="{% static 'chat/flags/td.svg' %}" alt="" title="Tchad"></span>
              <span>Fulfulde de l’Est (Nigeria, Cameroun, Tchad)</span>
            </button>
          </div>
          <div class="suggestions" style="display: none;">
            <button class="chip" data-prompt="Explique-moi la cryptographie post-quantique simplement.">Cryptographie post-quantique</button>
            <button class="chip" data-prompt="Aide-moi à structurer un rapport technique de 10 pages.">Structurer un rapport</button>
            <button class="chip" data-prompt="Écris une fonction Python qui valide une adresse e-mail, avec des tests.">Écrire du code</button>
            <button class="chip" data-prompt="Donne-moi un plan d'étude de 4 semaines pour apprendre la sécurité des réseaux.">Plan d'étude</button>
          </div>
        </div>
      </section>

      <footer class="composer-wrap">
        <div class="attachment-list" id="attachmentList" aria-live="polite"></div>
        <form class="composer" id="composer">
          <button type="button" class="composer-tool" id="attachBtn" aria-label="Joindre des fichiers" title="Joindre des fichiers">＋</button>
          <input id="fileInput" class="visually-hidden" type="file" multiple
            accept=".pdf,.png,.jpg,.jpeg,.webp,.gif,.txt,.md,.csv,.json,.mp3,.wav,.m4a,.ogg,.opus,.aac,.flac,.webm,.mp4,.mov">
          <button type="button" class="composer-tool" id="micBtn" aria-label="Enregistrer un message vocal" title="Enregistrer un message vocal">🎙</button>
          <textarea id="input" rows="1" placeholder="Posez votre question à Gaandal…" maxlength="20000"></textarea>
          <button type="submit" class="send" id="sendBtn" aria-label="Envoyer">➤</button>
        </form>
        <div class="disclaimer">PDF, images, textes, audio et vidéo (5 fichiers, 15 Mo maximum chacun). Les fichiers sont transmis à Gemini pour analyse.</div>
      </footer>
    </main>
  </div>
  <script src="{% static 'chat/js/app.js' %}?v=flags3"></script>
</body>
</html>
